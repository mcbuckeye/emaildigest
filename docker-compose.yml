services:
  emaildigest-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: emaildigest
      POSTGRES_PASSWORD: emaildigest
      POSTGRES_DB: emaildigest
    volumes:
      - emaildigest-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emaildigest -d emaildigest"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dokploy-network

  emaildigest-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - emaildigest-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dokploy-network

  emaildigest-backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://emaildigest:emaildigest@emaildigest-postgres:5432/emaildigest
      REDIS_URL: redis://emaildigest-redis:6379/0
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_DEBUG: false
      SMTP2GO_API_KEY: ${SMTP_PASS}
      SMTP2GO_FROM_EMAIL: ${SMTP_FROM}
      SMTP2GO_FROM_NAME: EmailDigest
      SECRET_KEY: ${SECRET_KEY:-change-this-in-dokploy}
    depends_on:
      emaildigest-postgres:
        condition: service_healthy
      emaildigest-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    networks:
      - dokploy-network

  emaildigest-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://emaildigest:emaildigest@emaildigest-postgres:5432/emaildigest
      REDIS_URL: redis://emaildigest-redis:6379/0
      SMTP2GO_API_KEY: ${SMTP_PASS}
      SMTP2GO_FROM_EMAIL: ${SMTP_FROM}
      SMTP2GO_FROM_NAME: EmailDigest
      SECRET_KEY: ${SECRET_KEY:-change-this-in-dokploy}
    depends_on:
      emaildigest-postgres:
        condition: service_healthy
      emaildigest-redis:
        condition: service_healthy
      emaildigest-backend:
        condition: service_healthy
    command: celery -A celery_worker worker --loglevel=info --concurrency=2
    networks:
      - dokploy-network

  emaildigest-frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "3050:80"
    depends_on:
      - emaildigest-backend
    networks:
      - dokploy-network

volumes:
  emaildigest-pgdata:
    name: emaildigest-pgdata
  emaildigest-redisdata:
    name: emaildigest-redisdata

networks:
  dokploy-network:
    external: true
