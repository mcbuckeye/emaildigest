[project]
name = "emaildigest"
version = "0.1.0"
description = "AI-powered email newsletter automation platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<5.0.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.10.0",
    "email-validator>=2.2.0",
    "pydantic-settings>=2.7.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.13.0",
    "bleach>=6.2.0",
    "html2text>=2024.2.26",
    "jinja2>=3.1.0",
    "aiosmtplib>=3.0.0",
    "croniter>=6.0.0",
    "feedparser>=6.0.0",
    "aiohttp>=3.10.0",
    "openai>=1.60.0",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "asgi-lifespan>=2.1.0",
    "freezegun>=1.5.0",
    "testcontainers[postgresql]>=4.9.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
    "psycopg2-binary>=2.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["."]
markers = [
    "integration: integration tests requiring external services",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["B008", "UP042"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "src/alembic/*"]
